{{ $image := resources.Get (strings.TrimPrefix "/" (.Get "src")) }}
{{ $small := $image.Resize "640x webp q82" }}
{{ $medium := $image.Resize "1200x webp q82" }}
{{ $large := $image.Resize "1800x webp q82" }}
<section class="photo-item">
    <figure>
        <a class="gallery-link" href="{{ .Get "src" }}" data-gallery data-title="{{ .Get "title" }}" data-width="{{ $image.Width }}" data-height="{{ $image.Height }}" aria-label="View original: {{ .Get "title" }}">
            <img src="{{ $medium.RelPermalink }}" srcset="{{ $small.RelPermalink }} 640w, {{ $medium.RelPermalink }} 1200w, {{ $large.RelPermalink }} 1800w" sizes="(max-width: 700px) calc(100vw - 40px), (max-width: 1140px) calc((100vw - 64px) / 2), 528px" alt="{{ .Get "alt" }}" width="{{ $image.Width }}" height="{{ $image.Height }}" loading="{{ .Get "loading" | default "lazy" }}" decoding="async">
            <span class="photo-enlarge" aria-hidden="true">View full size ↗</span>
        </a>
        <figcaption><h2>{{ .Get "title" }}</h2><p>{{ .Get "caption" }}</p></figcaption>
    </figure>
    <details><summary>Behind the photo</summary><div>{{ .Inner | markdownify }}</div></details>
</section>
