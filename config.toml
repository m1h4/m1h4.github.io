baseURL = "https://www.mihasoftware.com/"
locale = "en-US"
title = "miha software"
theme = "m1h4"
disableKinds = ["taxonomy", "term", "RSS"]
enableRobotsTXT = true

# Also expose existing static images to Hugo's image renderer without moving URLs.
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "static"
target = "assets"

[params]
dateFormat = "January 2, 2006"
email = "support@mihasoftware.com"
copyrightYear = 2022
tagline = "Software Development by Marko Mihovilić"
author = "Marko Mihovilić"
description = "Small, useful apps by Marko Mihovilić. Explore Events, Photo Resize and Beam, find support, and browse older projects."

[params.analytics]
# Public beacon identifier; analytics are emitted only in production builds.
cloudflareToken = "911dfbcffec844e8a476ed3047ed14ea"
